<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BatchCalculator</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <meta name="theme-color" content="#2c3e50" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Include the header HTML -->
  <div id="header-container"></div>

  <div class="dial-container">
    <div class="dial"><label>Vol.</label><div class="scroll-list" id="volumeList"></div></div>
    <div class="dial"><label>SH %</label><div class="scroll-list" id="shList"></div></div>
    <div class="dial"><label>Surfactant</label><div class="scroll-list" id="surfactantList"></div></div>
    <div class="dial"><label>Scent</label><div class="scroll-list" id="scentList"></div></div>
  </div>

  <div class="result" id="output">
    <div class="result-table" id="resultsTable">
      <div>Cost</div><div>Water</div><div>0.00L</div>
      <div>$0.00</div><div>SH</div><div>0.00L</div>
      <div>$0.00</div><div>Surfactant</div><div>0.00L</div>
      <div>$0.00</div><div>Scent</div><div>0.00L</div>
    </div>
    <button id="saveLogBtn" onclick="saveLog()">💾 Save Mix to Log</button>
    <button id="addToBatchBtn" onclick="showAddToBatch()">➕ Add to Existing Batch</button>
  </div>

  <!-- Add-to-Batch Modal -->
  <div id="addBatchModal" style="display:none; position:fixed; top:10%; left:10%; width:80%; background:#fff; padding:1rem; border-radius:12px; box-shadow:0 0 10px #000; z-index:1000;">
    <h3>Add to Existing Batch</h3>
    <label for="batchDropdown">Select a batch:</label>
    <select id="batchDropdown" style="width:100%; margin-bottom:1rem;"></select>

    <label>Extra Volume (L):</label>
    <input type="number" id="extraVolume" placeholder="e.g. 20" style="width:100%; margin-bottom:1rem;" />

    <button onclick="addToExistingBatch()">✅ Add Volume</button>
    <button onclick="closeAddToBatch()" style="float:right;">❌ Cancel</button>
  </div>

  <script src="header.js"></script>
  <script>
    let isLocked = false;
    const lockBtn = document.getElementById("lockBtn");

    function toggleLock() {
      isLocked = !isLocked;
      lockBtn.textContent = isLocked ? "🔒" : "🔓";
      alert(isLocked ? "Dial is now locked." : "Dial is now unlocked.");
    }

    const volumeList = document.getElementById("volumeList");
    const shList = document.getElementById("shList");
    const surfactantList = document.getElementById("surfactantList");
    const scentList = document.getElementById("scentList");

    const surfOptions = [0.001, 0.002, 0.01, 0.0133, 0.0167, 0.02, 0.025, 0.0333];
    const scentOptions = [0.001, 0.002, 0.01, 0.0133, 0.0167, 0.02, 0.025, 0.0333];

    function formatRatio(value) {
      const ratio = Math.round(1 / value);
      return `1:${ratio}`;
    }

    function createOptionList(container, options, unit, isRatio = false) {
      const hyphenStart = document.createElement("div");
      hyphenStart.className = "scroll-item";
      hyphenStart.textContent = "-";
      container.appendChild(hyphenStart);

      if (isRatio) {
        const zeroItem = document.createElement("div");
        zeroItem.className = "scroll-item";
        zeroItem.dataset.value = 0;
        zeroItem.textContent = "0";
        container.appendChild(zeroItem);
      }

      options.forEach((val) => {
        const item = document.createElement("div");
        item.className = "scroll-item";
        item.dataset.value = val;
        item.textContent = isRatio ? formatRatio(val) : val + (unit || "");
        container.appendChild(item);
      });

      const hyphenEnd = document.createElement("div");
      hyphenEnd.className = "scroll-item";
      hyphenEnd.textContent = "-";
      container.appendChild(hyphenEnd);
    }

    function getCenterValue(container) {
      const containerRect = container.getBoundingClientRect();
      const centerY = containerRect.top + container.clientHeight / 2;
      const items = container.querySelectorAll(".scroll-item");
      let closest = null;
      let minDist = Infinity;

      items.forEach(item => {
        const rect = item.getBoundingClientRect();
        const itemCenter = rect.top + rect.height / 2;
        const dist = Math.abs(centerY - itemCenter);
        if (dist < minDist) {
          minDist = dist;
          closest = item;
        }
        item.classList.remove("selected");
      });

      if (closest) {
        closest.classList.add("selected");
        return parseFloat(closest.dataset.value);
      }
      return null;
    }

    function loadSettings() {
      const settings = JSON.parse(localStorage.getItem("batchSettings")) || {};
      return {
        stockSH: parseFloat(settings.shStrength) || 12.5,
        shCostPerL: settings.shCost && settings.shSize ? settings.shCost / settings.shSize : 1.5,
        surfCostPerL: settings.surfCost && settings.surfSize ? settings.surfCost / settings.surfSize : 6.0,
        scentCostPerL: settings.scentCost && settings.scentSize ? settings.scentCost / settings.scentSize : 8.0
      };
    }

    function calculate() {
      const volume = getCenterValue(volumeList);
      const sh = getCenterValue(shList);
      const surfactant = getCenterValue(surfactantList);
      const scent = getCenterValue(scentList);
      if ([volume, sh, surfactant, scent].includes(null)) return;

      const { stockSH, shCostPerL, surfCostPerL, scentCostPerL } = loadSettings();
      const shVol = (sh / stockSH) * volume;
      const surfVol = surfactant * volume;
      const scentVol = scent * volume;
      const water = volume - shVol - surfVol - scentVol;

      const shCost = shVol * shCostPerL;
      const surfCost = surfVol * surfCostPerL;
      const scentCost = scentVol * scentCostPerL;

      document.getElementById("resultsTable").innerHTML = `
        <div>Cost</div><div>Water</div><div>${water.toFixed(2)}L</div>
        <div>$${shCost.toFixed(2)}</div><div>SH</div><div>${shVol.toFixed(2)}L</div>
        <div>$${surfCost.toFixed(2)}</div><div>Surfactant</div><div>${surfVol.toFixed(2)}L</div>
        <div>$${scentCost.toFixed(2)}</div><div>Scent</div><div>${scentVol.toFixed(2)}L</div>
      `;
    }

    async function saveLog() {
      const volume = getCenterValue(volumeList);
      const sh = getCenterValue(shList);
      const surf = getCenterValue(surfactantList);
      const scent = getCenterValue(scentList);
      if ([volume, sh, surf, scent].includes(null)) return;

      const timestamp = new Date().toLocaleString();
      const client = prompt("Client name?") || "";
      const address = prompt("Job address?") || "";
      const notes = prompt("Notes?") || "";

      let gps = "";
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => {
            gps = `${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`;
            finalizeLog(gps);
          },
          () => finalizeLog("Unavailable")
        );
      } else {
        finalizeLog("Not supported");
      }

      function finalizeLog(gpsCoords) {
        const newEntry = { timestamp, client, address, notes, gps: gpsCoords, sh, surf, scent };
        const logs = JSON.parse(localStorage.getItem("mixLogs") || "[]");
        logs.push(newEntry);
        localStorage.setItem("mixLogs", JSON.stringify(logs));
        alert("Mix saved to log!");
        window.location.href = "cost-log.html";
      }
    }

    function showAddToBatch() {
      const dropdown = document.getElementById("batchDropdown");
      dropdown.innerHTML = "";
      const logs = JSON.parse(localStorage.getItem("mixLogs") || "[]");

      logs.forEach((log, index) => {
        const option = document.createElement("option");
        option.value = index;
        option.textContent = `${log.timestamp} - ${log.client || "No client"}`;
        dropdown.appendChild(option);
      });

      document.getElementById("addBatchModal").style.display = "block";
    }

    function closeAddToBatch() {
      document.getElementById("addBatchModal").style.display = "none";
    }

    function addToExistingBatch() {
      const index = document.getElementById("batchDropdown").value;
      const extraVolume = parseFloat(document.getElementById("extraVolume").value);
      if (!index || isNaN(extraVolume) || extraVolume <= 0) {
        alert("Please select a batch and enter a valid volume.");
        return;
      }

      const logs = JSON.parse(localStorage.getItem("mixLogs") || "[]");
      const log = logs[index];

      const volume = getCenterValue(volumeList);
      const sh = getCenterValue(shList);
      const surf = getCenterValue(surfactantList);
      const scent = getCenterValue(scentList);
      if ([volume, sh, surf, scent].includes(null)) return;

      const { stockSH } = loadSettings();
      const addedSH = (sh / stockSH) * extraVolume;
      const addedSurfactant = surf * extraVolume;
      const addedScent = scent * extraVolume;

      log.sh += addedSH;
      log.surf += addedSurfactant;
      log.scent += addedScent;
      log.notes = (log.notes || "") + `\n➕ Added ${extraVolume}L (${addedSH.toFixed(2)}L SH, ${addedSurfactant.toFixed(2)}L Surfactant, ${addedScent.toFixed(2)}L Scent)`;

      logs[index] = log;
      localStorage.setItem("mixLogs", JSON.stringify(logs));
      alert("Existing batch updated!");
      closeAddToBatch();
    }

    [volumeList, shList, surfactantList, scentList].forEach(container => {
      let timeout;
      container.addEventListener("scroll", () => {
        if (isLocked) {
          container.scrollTop = container._lastScrollTop || 0;
          alert("Dial is locked.");
          return;
        }
        container._lastScrollTop = container.scrollTop;
        clearTimeout(timeout);
        timeout = setTimeout(() => calculate(), 200);
      });
    });

    createOptionList(volumeList, [...Array(41)].map((_, i) => (i + 1) * 5), "L");
    createOptionList(shList, [...Array(26)].map((_, i) => (i * 0.5).toFixed(1)), "%");
    createOptionList(surfactantList, surfOptions, "", true);
    createOptionList(scentList, scentOptions, "", true);
  </script>
</body>
</html>
