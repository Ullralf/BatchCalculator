<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BatchCalculator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <button onclick="toggleLock()">🔓</button>
    <h1>Batch Calculator</h1>
    <button onclick="toggleTheme()">🌙</button>
  </header>

  <main>
    <!-- Your existing batch inputs go here -->
    <button onclick="showAddToBatch()">➕ Add to Existing Batch</button>
    <button onclick="saveMixToLog()">💾 Save Mix to Log</button>
  </main>

  <!-- Add-to-Batch Modal -->
  <div id="addBatchModal" style="display:none; position:fixed; top:10%; left:10%; width:80%; background:#fff; padding:1rem; border-radius:12px; box-shadow:0 0 10px #000; z-index:1000;">
    <h3>Add to Existing Batch</h3>

    <label>Select batch to update:</label>
    <select id="batchDropdown" style="width:100%; margin-bottom:1rem;"></select>

    <label>Use previous mix settings?</label>
    <button onclick="loadMostRecentMix()" style="width:100%; margin-bottom:1rem;">🕘 Load Most Recent Saved Mix</button>

    <label>Extra Volume (L):</label>
    <input type="number" id="extraVolume" placeholder="e.g. 20" style="width:100%; margin-bottom:0.5rem;" />

    <label>SH %:</label>
    <input type="number" id="manualSH" placeholder="e.g. 1.5" step="0.1" style="width:100%; margin-bottom:0.5rem;" />

    <label>Surfactant Ratio (e.g. 0.01 for 1:100):</label>
    <input type="number" id="manualSurf" placeholder="e.g. 0.01" step="0.001" style="width:100%; margin-bottom:0.5rem;" />

    <label>Scent Ratio (e.g. 0.01 for 1:100):</label>
    <input type="number" id="manualScent" placeholder="e.g. 0.01" step="0.001" style="width:100%; margin-bottom:1rem;" />

    <button onclick="addToExistingBatch()">✅ Add Volume</button>
    <button onclick="closeAddToBatch()" style="float:right;">❌ Cancel</button>
  </div>

  <script>
    function toggleLock() {
      alert("Lock toggle placeholder");
    }

    function toggleTheme() {
      document.body.classList.toggle("dark");
    }

    function loadSettings() {
      return {
        stockSH: 12.5, // adjust this based on your app's config
      };
    }

    function showAddToBatch() {
      const dropdown = document.getElementById("batchDropdown");
      dropdown.innerHTML = "";
      const logs = JSON.parse(localStorage.getItem("mixLogs") || "[]");

      logs.forEach((log, index) => {
        const option = document.createElement("option");
        option.value = index;
        option.textContent = `${log.timestamp} - ${log.client || "No client"}`;
        dropdown.appendChild(option);
      });

      document.getElementById("extraVolume").value = "";
      document.getElementById("manualSH").value = "";
      document.getElementById("manualSurf").value = "";
      document.getElementById("manualScent").value = "";

      document.getElementById("addBatchModal").style.display = "block";
    }

    function closeAddToBatch() {
      document.getElementById("addBatchModal").style.display = "none";
    }

    function loadMostRecentMix() {
      const logs = JSON.parse(localStorage.getItem("mixLogs") || "[]");
      if (logs.length === 0) return alert("No saved mixes available.");

      const last = logs[logs.length - 1];
      const { sh, surf, scent } = last;

      const totalVol = (sh + surf + scent) / (sh / loadSettings().stockSH);
      const shPercent = (sh / totalVol) * loadSettings().stockSH;

      document.getElementById("manualSH").value = shPercent.toFixed(2);
      document.getElementById("manualSurf").value = (surf / totalVol).toFixed(4);
      document.getElementById("manualScent").value = (scent / totalVol).toFixed(4);
    }

    function addToExistingBatch() {
      const index = document.getElementById("batchDropdown").value;
      const extraVolume = parseFloat(document.getElementById("extraVolume").value);
      const manualSH = parseFloat(document.getElementById("manualSH").value);
      const manualSurf = parseFloat(document.getElementById("manualSurf").value);
      const manualScent = parseFloat(document.getElementById("manualScent").value);

      if (index === "" || isNaN(extraVolume) || isNaN(manualSH) || isNaN(manualSurf) || isNaN(manualScent)) {
        alert("Please select a batch and fill all fields.");
        return;
      }

      const logs = JSON.parse(localStorage.getItem("mixLogs") || "[]");
      const log = logs[index];
      const { stockSH } = loadSettings();

      const addedSH = (manualSH / stockSH) * extraVolume;
      const addedSurfactant = manualSurf * extraVolume;
      const addedScent = manualScent * extraVolume;

      log.sh += addedSH;
      log.surf += addedSurfactant;
      log.scent += addedScent;
      log.notes = (log.notes || "") + `\n➕ Added ${extraVolume}L (${addedSH.toFixed(2)}L SH, ${addedSurfactant.toFixed(2)}L Surfactant, ${addedScent.toFixed(2)}L Scent)`;

      logs[index] = log;
      localStorage.setItem("mixLogs", JSON.stringify(logs));
      alert("Existing batch updated!");
      closeAddToBatch();
    }

    function saveMixToLog() {
      // Basic example only. Customize for your form structure.
      const logs = JSON.parse(localStorage.getItem("mixLogs") || "[]");
      logs.push({
        timestamp: new Date().toLocaleString(),
        sh: 2,
        surf: 0.2,
        scent: 0.1,
        client: "Sample Client",
        notes: ""
      });
      localStorage.setItem("mixLogs", JSON.stringify(logs));
      alert("Saved sample mix to log.");
    }
  </script>
</body>
</html>
