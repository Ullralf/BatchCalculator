<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BatchCalculator</title>
  <link rel="stylesheet" href="styles.css" />
  <script defer src="header.js"></script>
</head>

<body>
  <header id="header"></header>

  <main>
    <!-- Main Dials -->
    <section class="dial-section">
      <h2>Batch Mix</h2>
      <div class="dial-container">
        <div class="dial-column">
          <h3>Volume (L)</h3>
          <ul class="scroll-list" id="volumeList"></ul>
        </div>
        <div class="dial-column">
          <h3>SH %</h3>
          <ul class="scroll-list" id="shList"></ul>
        </div>
        <div class="dial-column">
          <h3>Surfactant (L/L)</h3>
          <ul class="scroll-list" id="surfactantList"></ul>
        </div>
        <div class="dial-column">
          <h3>Scent (L/L)</h3>
          <ul class="scroll-list" id="scentList"></ul>
        </div>
      </div>
      <div id="resultsTable" class="result-table"></div>
      <button onclick="saveMix()">💾 Save Mix to Log</button>
      <button onclick="toggleAdditionForm()">➕ Add to Existing Batch</button>
    </section>

    <!-- Additional Mix Section -->
    <section class="dial-section" id="additionSection" style="display: none;">
      <h2>Add to Batch</h2>
      <div class="dial-container">
        <div class="dial-column">
          <h3>Volume (L)</h3>
          <ul class="scroll-list" id="addVolumeList"></ul>
        </div>
        <div class="dial-column">
          <h3>SH %</h3>
          <ul class="scroll-list" id="addSHList"></ul>
        </div>
        <div class="dial-column">
          <h3>Surfactant (L/L)</h3>
          <ul class="scroll-list" id="addSurfactantList"></ul>
        </div>
        <div class="dial-column">
          <h3>Scent (L/L)</h3>
          <ul class="scroll-list" id="addScentList"></ul>
        </div>
      </div>
      <button onclick="combineBatches()">🧪 Combine</button>
      <div id="additionOutput" class="result-table"></div>
    </section>
  </main>

  <script>
    // Load settings
    function loadSettings() {
      return {
        stockSH: 12.5,
        shCostPerL: 0.5,
        surfCostPerL: 1.0,
        scentCostPerL: 2.0
      };
    }

    // Utility to create dial values
    function populateList(listId, values) {
      const list = document.getElementById(listId);
      values.forEach(val => {
        const li = document.createElement("li");
        li.textContent = val;
        list.appendChild(li);
      });
    }

    // Utility to get centered value
    function getCenterValue(list) {
      const items = [...list.querySelectorAll("li")];
      const middleIndex = Math.floor(items.length / 2);
      const val = parseFloat(items[middleIndex].textContent);
      return isNaN(val) ? null : val;
    }

    // Main calculator
    function calculate() {
      const vol = getCenterValue(document.getElementById("volumeList"));
      const sh = getCenterValue(document.getElementById("shList"));
      const surf = getCenterValue(document.getElementById("surfactantList"));
      const scent = getCenterValue(document.getElementById("scentList"));

      if ([vol, sh, surf, scent].includes(null)) return;

      const { stockSH, shCostPerL, surfCostPerL, scentCostPerL } = loadSettings();

      const requiredSH = (sh / stockSH) * vol;
      const requiredSurf = surf * vol;
      const requiredScent = scent * vol;
      const water = vol - requiredSH - requiredSurf - requiredScent;

      const costSH = requiredSH * shCostPerL;
      const costSurf = requiredSurf * surfCostPerL;
      const costScent = requiredScent * scentCostPerL;
      const totalCost = costSH + costSurf + costScent;

      document.getElementById("resultsTable").innerHTML = `
        <div>Cost</div><div>Water</div><div>${water.toFixed(2)}L</div>
        <div>$${totalCost.toFixed(2)}</div><div>SH</div><div>${requiredSH.toFixed(2)}L</div>
        <div>$${costSH.toFixed(2)}</div><div>Surfactant</div><div>${requiredSurf.toFixed(2)}L</div>
        <div>$${costSurf.toFixed(2)}</div><div>Scent</div><div>${requiredScent.toFixed(2)}L</div>
        <div>$${costScent.toFixed(2)}</div><div></div><div></div>
      `;
    }

    // Combine Batches
    function combineBatches() {
      const vol = getCenterValue(document.getElementById("addVolumeList"));
      const sh = getCenterValue(document.getElementById("addSHList"));
      const surf = getCenterValue(document.getElementById("addSurfactantList"));
      const scent = getCenterValue(document.getElementById("addScentList"));

      if ([vol, sh, surf, scent].includes(null)) return;

      const { stockSH, shCostPerL, surfCostPerL, scentCostPerL } = loadSettings();

      const requiredSH = (sh / stockSH) * vol;
      const requiredSurf = surf * vol;
      const requiredScent = scent * vol;
      const water = vol - requiredSH - requiredSurf - requiredScent;

      const costSH = requiredSH * shCostPerL;
      const costSurf = requiredSurf * surfCostPerL;
      const costScent = requiredScent * scentCostPerL;
      const totalCost = costSH + costSurf + costScent;

      document.getElementById("additionOutput").innerHTML = `
        <div>Cost</div><div>Water</div><div>${water.toFixed(2)}L</div>
        <div>$${totalCost.toFixed(2)}</div><div>SH</div><div>${requiredSH.toFixed(2)}L</div>
        <div>$${costSH.toFixed(2)}</div><div>Surfactant</div><div>${requiredSurf.toFixed(2)}L</div>
        <div>$${costSurf.toFixed(2)}</div><div>Scent</div><div>${requiredScent.toFixed(2)}L</div>
        <div>$${costScent.toFixed(2)}</div><div></div><div></div>
      `;
    }

    function toggleAdditionForm() {
      const section = document.getElementById("additionSection");
      section.style.display = section.style.display === "none" ? "block" : "none";
    }

    function saveMix() {
      alert("Mix saved (placeholder).");
    }

    // Populate initial dials
    window.onload = function () {
      populateList("volumeList", [5, 10, 15, 20, 25, 30]);
      populateList("shList", [1, 2, 3, 4, 5, 6]);
      populateList("surfactantList", [0.1, 0.2, 0.3, 0.4]);
      populateList("scentList", [0.05, 0.1, 0.15, 0.2]);

      populateList("addVolumeList", [5, 10, 15, 20, 25, 30]);
      populateList("addSHList", [1, 2, 3, 4, 5, 6]);
      populateList("addSurfactantList", [0.1, 0.2, 0.3, 0.4]);
      populateList("addScentList", [0.05, 0.1, 0.15, 0.2]);

      document.querySelectorAll(".scroll-list").forEach(list => {
        list.addEventListener("scroll", calculate);
      });
    };
  </script>
</body>

</html>
