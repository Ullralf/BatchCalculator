<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BatchCalculator</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="header.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <header id="header"></header>

  <main>
    <h1>Batch Calculator</h1>

    <!-- Main batch inputs -->
    <section id="mainBatch">
      <label>Total Volume (L): <input type="number" id="volume" /></label>
      <label>SH (%): <input type="number" id="sh" /></label>
      <label>Surfactant Ratio: <input type="number" id="surfactant" /></label>
      <label>Scent Ratio: <input type="number" id="scent" /></label>
      <button onclick="calculate()">Calculate Mix</button>
    </section>

    <!-- Results table -->
    <h3>Main Mix Results</h3>
    <div id="resultsTable" class="result-table"></div>

    <!-- Add to Existing Batch Section -->
    <section>
      <button onclick="toggleAddBatch()">Add to Existing Batch</button>

      <div id="addBatchSection" style="display:none;">
        <label>Select Existing Batch:
          <select id="batchSelect"></select>
        </label>

        <label>Tank Volume (L): <input type="number" id="tankVolume" /></label>
        <label>Tank SH (%): <input type="number" id="tankSH" /></label>
        <label>Tank Surfactant: <input type="number" id="tankSurfactant" /></label>
        <label>Tank Scent: <input type="number" id="tankScent" /></label>

        <button onclick="combineBatches()">Calculate Additions</button>

        <h3>Required to Complete Batch</h3>
        <div id="additionOutput" class="result-table"></div>
      </div>
    </section>
  </main>

  <script>
    function toggleAddBatch() {
      const section = document.getElementById("addBatchSection");
      section.style.display = section.style.display === "none" ? "block" : "none";
    }

    function calculate() {
      const vol = parseFloat(document.getElementById("volume").value) || 0;
      const sh = parseFloat(document.getElementById("sh").value) || 0;
      const surf = parseFloat(document.getElementById("surfactant").value) || 0;
      const scent = parseFloat(document.getElementById("scent").value) || 0;

      const stockSH = 12.5; // Assume default
      const shL = (vol * sh) / stockSH;
      const surfL = vol * surf;
      const scentL = vol * scent;
      const water = vol - shL - surfL - scentL;

      const costSH = shL * 1.0;
      const costSurf = surfL * 1.0;
      const costScent = scentL * 1.0;
      const totalCost = costSH + costSurf + costScent;

      document.getElementById("resultsTable").innerHTML = `
        <div>Cost</div><div>Water</div><div>${water.toFixed(2)}L</div>
        <div>$${totalCost.toFixed(2)}</div><div>SH</div><div>${shL.toFixed(2)}L</div>
        <div>$${costSH.toFixed(2)}</div><div>Surfactant</div><div>${surfL.toFixed(2)}L</div>
        <div>$${costSurf.toFixed(2)}</div><div>Scent</div><div>${scentL.toFixed(2)}L</div>
        <div>$${costScent.toFixed(2)}</div><div></div><div></div>
      `;
    }

    function combineBatches() {
      const totalVol = parseFloat(document.getElementById("volume").value) || 0;
      const targetSH = parseFloat(document.getElementById("sh").value) || 0;
      const targetSurf = parseFloat(document.getElementById("surfactant").value) || 0;
      const targetScent = parseFloat(document.getElementById("scent").value) || 0;

      const tankVol = parseFloat(document.getElementById("tankVolume").value) || 0;
      const tankSH = parseFloat(document.getElementById("tankSH").value) || 0;
      const tankSurf = parseFloat(document.getElementById("tankSurfactant").value) || 0;
      const tankScent = parseFloat(document.getElementById("tankScent").value) || 0;

      const stockSH = 12.5;
      const totalSHL = (totalVol * targetSH) / stockSH;
      const totalSurfL = totalVol * targetSurf;
      const totalScentL = totalVol * targetScent;

      const currentSHL = (tankVol * tankSH) / stockSH;
      const currentSurfL = tankVol * tankSurf;
      const currentScentL = tankVol * tankScent;

      const requiredSH = totalSHL - currentSHL;
      const requiredSurf = totalSurfL - currentSurfL;
      const requiredScent = totalScentL - currentScentL;
      const totalRequired = requiredSH + requiredSurf + requiredScent;
      const water = totalVol - tankVol - totalRequired;

      const costSH = requiredSH * 1.0;
      const costSurf = requiredSurf * 1.0;
      const costScent = requiredScent * 1.0;
      const totalCost = costSH + costSurf + costScent;

      document.getElementById("additionOutput").innerHTML = `
        <div>Cost</div><div>Water</div><div>${water.toFixed(2)}L</div>
        <div>$${totalCost.toFixed(2)}</div><div>SH</div><div>${requiredSH.toFixed(2)}L</div>
        <div>$${costSH.toFixed(2)}</div><div>Surfactant</div><div>${requiredSurf.toFixed(2)}L</div>
        <div>$${costSurf.toFixed(2)}</div><div>Scent</div><div>${requiredScent.toFixed(2)}L</div>
        <div>$${costScent.toFixed(2)}</div><div></div><div></div>
      `;
    }
  </script>
</body>
</html>
