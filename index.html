<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BatchCalculator</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <script src="header.js" defer></script>
</head>
<body>
  <header id="header"></header>

  <main>
    <h1>Batch Calculator</h1>

    <!-- Inputs -->
    <label for="volume">Volume (L):</label>
    <input type="number" id="volume" placeholder="Enter volume" step="0.1" />

    <label for="sh">Target SH (%):</label>
    <input type="number" id="sh" placeholder="Enter SH %" step="0.1" />

    <label for="stockSH">Stock SH (%):</label>
    <input type="number" id="stockSH" value="12.5" step="0.1" />

    <label for="surfactant">Surfactant Ratio:</label>
    <input type="number" id="surfactant" value="0.01" step="0.001" />

    <label for="scent">Scent Ratio:</label>
    <input type="number" id="scent" value="0.002" step="0.001" />

    <button onclick="calculate()">🧪 Calculate</button>

    <!-- Results Table -->
    <table id="resultsTable" style="margin-top: 20px; display: none;">
      <thead>
        <tr><th>Ingredient</th><th>Amount (L)</th></tr>
      </thead>
      <tbody>
        <tr><td>SH</td><td id="shResult"></td></tr>
        <tr><td>Surfactant</td><td id="surfResult"></td></tr>
        <tr><td>Scent</td><td id="scentResult"></td></tr>
        <tr><td>Water</td><td id="waterResult"></td></tr>
      </tbody>
    </table>

    <!-- Save / Add buttons -->
    <div style="margin-top: 20px; display: flex; gap: 1rem;">
      <button id="saveLogBtn" onclick="saveLog()" class="action-btn">💾 Save Mix to Log</button>
      <button id="addToBatchBtn" onclick="toggleAddToBatch()" class="action-btn">➕ Add to Existing Batch</button>
    </div>

    <!-- Add to Batch Section -->
    <div id="addToBatchDials" style="display: none; margin-top: 20px;">
      <h3>Add to Existing Batch</h3>
      <label for="extraVolume">Volume (L):</label>
      <input type="number" id="extraVolume" step="0.1" />

      <label for="manualSH">Target SH (%):</label>
      <input type="number" id="manualSH" step="0.1" />

      <label for="manualStockSH">Stock SH (%):</label>
      <input type="number" id="manualStockSH" step="0.1" />

      <label for="manualSurf">Surfactant Ratio:</label>
      <input type="number" id="manualSurf" step="0.001" />

      <label for="manualScent">Scent Ratio:</label>
      <input type="number" id="manualScent" step="0.001" />

      <button onclick="calculateAddedBatch()">🧪 Calculate</button>

      <!-- Add Batch Results Table -->
      <table id="addedResultsTable" style="margin-top: 20px; display: none;">
        <thead>
          <tr><th>Ingredient</th><th>Amount (L)</th></tr>
        </thead>
        <tbody>
          <tr><td>SH</td><td id="addedSH"></td></tr>
          <tr><td>Surfactant</td><td id="addedSurf"></td></tr>
          <tr><td>Scent</td><td id="addedScent"></td></tr>
          <tr><td>Water</td><td id="addedWater"></td></tr>
        </tbody>
      </table>

      <div id="remainingInfo" style="margin-top: 10px; font-size: 0.9rem; color: gray;">
        Remaining from batch: <span id="remainingLitres">0.00</span> L
      </div>
    </div>
  </main>

  <script>
    function calculate() {
      const vol = parseFloat(document.getElementById("volume").value);
      const targetSH = parseFloat(document.getElementById("sh").value);
      const stockSH = parseFloat(document.getElementById("stockSH").value);
      const surfRatio = parseFloat(document.getElementById("surfactant").value);
      const scentRatio = parseFloat(document.getElementById("scent").value);

      const sh = ((targetSH / stockSH) * vol).toFixed(2);
      const surf = (surfRatio * vol).toFixed(2);
      const scent = (scentRatio * vol).toFixed(2);
      const water = (vol - sh - surf - scent).toFixed(2);

      document.getElementById("shResult").textContent = sh;
      document.getElementById("surfResult").textContent = surf;
      document.getElementById("scentResult").textContent = scent;
      document.getElementById("waterResult").textContent = water;

      document.getElementById("resultsTable").style.display = "table";
    }

    function saveLog() {
      const log = {
        vol: parseFloat(document.getElementById("volume").value),
        sh: parseFloat(document.getElementById("shResult").textContent),
        surf: parseFloat(document.getElementById("surfResult").textContent),
        scent: parseFloat(document.getElementById("scentResult").textContent),
        water: parseFloat(document.getElementById("waterResult").textContent),
        stockSH: parseFloat(document.getElementById("stockSH").value),
        timestamp: new Date().toISOString()
      };

      const logs = JSON.parse(localStorage.getItem("mixLogs") || "[]");
      logs.push(log);
      localStorage.setItem("mixLogs", JSON.stringify(logs));
      alert("Mix saved to log.");
    }

    function toggleAddToBatch() {
      const dials = document.getElementById("addToBatchDials");
      const logs = JSON.parse(localStorage.getItem("mixLogs") || "[]");
      const last = logs[logs.length - 1];

      if (!last) {
        alert("No existing batch found.");
        return;
      }

      const totalVol = last.vol;
      const usedVol = last.sh + last.surf + last.scent + last.water;
      const remainingVol = Math.max(totalVol - usedVol, 0).toFixed(2);

      const shPercent = ((last.sh / last.vol) * last.stockSH).toFixed(2);
      const surfRatio = (last.surf / last.vol).toFixed(3);
      const scentRatio = (last.scent / last.vol).toFixed(3);

      document.getElementById("extraVolume").value = remainingVol;
      document.getElementById("manualSH").value = shPercent;
      document.getElementById("manualStockSH").value = last.stockSH;
      document.getElementById("manualSurf").value = surfRatio;
      document.getElementById("manualScent").value = scentRatio;
      document.getElementById("remainingLitres").textContent = remainingVol;

      dials.style.display = "block";
    }

    function calculateAddedBatch() {
      const vol = parseFloat(document.getElementById("extraVolume").value);
      const targetSH = parseFloat(document.getElementById("manualSH").value);
      const stockSH = parseFloat(document.getElementById("manualStockSH").value);
      const surfRatio = parseFloat(document.getElementById("manualSurf").value);
      const scentRatio = parseFloat(document.getElementById("manualScent").value);

      const sh = ((targetSH / stockSH) * vol).toFixed(2);
      const surf = (surfRatio * vol).toFixed(2);
      const scent = (scentRatio * vol).toFixed(2);
      const water = (vol - sh - surf - scent).toFixed(2);

      document.getElementById("addedSH").textContent = sh;
      document.getElementById("addedSurf").textContent = surf;
      document.getElementById("addedScent").textContent = scent;
      document.getElementById("addedWater").textContent = water;

      document.getElementById("addedResultsTable").style.display = "table";
    }
  </script>
</body>
</html>
