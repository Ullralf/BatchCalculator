<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BatchCalculator</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="icons/icon-192.png" />
  <script defer src="header.js"></script>
</head>
<body>
  <div id="header-container"></div>

  <!-- Main Dials -->
  <div class="dial-container">
    <div class="dial"><label>Vol.</label><div class="scroll-list" id="volumeList"></div></div>
    <div class="dial"><label>SH %</label><div class="scroll-list" id="shList"></div></div>
    <div class="dial"><label>Surfactant</label><div class="scroll-list" id="surfactantList"></div></div>
    <div class="dial"><label>Scent</label><div class="scroll-list" id="scentList"></div></div>
  </div>

  <!-- Results -->
  <div class="result-table" id="resultTable"></div>

  <!-- Action Buttons -->
  <div class="action-buttons">
    <button onclick="calculateMix()" class="action-btn">🧪 Calculate Mix</button>
    <button onclick="saveMix()" class="action-btn">💾 Save Mix to Log</button>
    <button onclick="toggleAddToBatch()" class="action-btn">➕ Add to Existing Batch</button>
  </div>

  <!-- Add to Existing Batch Section -->
  <div id="addToBatchSection" style="display:none; margin-top: 30px;">
    <label for="existingBatchSelect">Select Existing Batch:</label>
    <select id="existingBatchSelect"></select>

    <div id="secondDialContainer" style="border-top: 1px solid #ccc; margin-top: 20px; padding-top: 20px;">
      <h3 style="margin-left: 10px;">Current Contents in Tank</h3>
      <div class="dial-container">
        <div class="dial"><label>Vol.</label><div class="scroll-list" id="currentVolumeList"></div></div>
        <div class="dial"><label>SH %</label><div class="scroll-list" id="currentShList"></div></div>
        <div class="dial"><label>Surfactant</label><div class="scroll-list" id="currentSurfactantList"></div></div>
        <div class="dial"><label>Scent</label><div class="scroll-list" id="currentScentList"></div></div>
      </div>

      <button onclick="combineBatches()" class="action-btn">🔄 Calculate Additions</button>
      <div id="additionOutput" class="result-table"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
