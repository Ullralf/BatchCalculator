<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BatchCalculator</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <script defer src="script.js"></script>
  <script defer src="header.js"></script>
</head>
<body>
  <header id="header"></header>

  <main>
    <section class="calculator">
      <label for="totalVolume">Total Volume (L):</label>
      <input type="number" id="totalVolume" placeholder="e.g. 20" />

      <label for="shPercentage">SH Percentage (%):</label>
      <input type="number" id="shPercentage" placeholder="e.g. 1" />

      <label for="surfactantRatio">Surfactant Ratio:</label>
      <input type="number" id="surfactantRatio" placeholder="e.g. 30" />

      <label for="scentRatio">Scent Ratio:</label>
      <input type="number" id="scentRatio" placeholder="e.g. 50" />

      <button onclick="calculate()">Calculate</button>
      <button onclick="saveMix()">Save Mix to Log</button>
      <button onclick="toggleAddSection()" id="toggleAddBtn">Add to Existing Batch</button>
    </section>

    <div class="output">
      <h3>Main Mix Results</h3>
      <div class="result-table" id="resultsTable"></div>
    </div>

    <div id="addToBatchSection" style="display:none; margin-top:2rem;">
      <h3>Add to Existing Batch</h3>
      <section class="calculator">
        <label for="addVolume">Additional Volume (L):</label>
        <input type="number" id="addVolume" placeholder="e.g. 10" />

        <label for="addSH">SH %:</label>
        <input type="number" id="addSH" placeholder="e.g. 1" />

        <label for="addSurfactant">Surfactant Ratio:</label>
        <input type="number" id="addSurfactant" placeholder="e.g. 30" />

        <label for="addScent">Scent Ratio:</label>
        <input type="number" id="addScent" placeholder="e.g. 50" />

        <button onclick="combineBatches()">Calculate Additional Mix</button>
      </section>

      <div id="additionOutput" class="output"></div>
    </div>
  </main>

  <script>
    function toggleAddSection() {
      const section = document.getElementById("addToBatchSection");
      section.style.display = section.style.display === "none" ? "block" : "none";
    }

    function combineBatches() {
      const addVolume = parseFloat(document.getElementById("addVolume").value);
      const shPercent = parseFloat(document.getElementById("addSH").value);
      const surfRatio = parseFloat(document.getElementById("addSurfactant").value);
      const scentRatio = parseFloat(document.getElementById("addScent").value);

      if (isNaN(addVolume) || isNaN(shPercent) || isNaN(surfRatio) || isNaN(scentRatio)) {
        alert("Please enter all additional batch values.");
        return;
      }

      const requiredSH = (addVolume * (shPercent / 100)) / 0.125;
      const requiredSurf = addVolume / surfRatio;
      const requiredScent = addVolume / scentRatio;
      const water = addVolume - (requiredSH + requiredSurf + requiredScent);

      const { shCostPerL = 1.0, surfCostPerL = 1.0, scentCostPerL = 1.0 } = loadSettings();
      const costSH = requiredSH * shCostPerL;
      const costSurf = requiredSurf * surfCostPerL;
      const costScent = requiredScent * scentCostPerL;
      const totalCost = costSH + costSurf + costScent;

      document.getElementById("additionOutput").innerHTML = `
        <div class="result-table">
          <div>Cost</div><div>Water</div><div>${water.toFixed(2)}L</div>
          <div>$${totalCost.toFixed(2)}</div><div>SH</div><div>${requiredSH.toFixed(2)}L</div>
          <div>$${costSH.toFixed(2)}</div><div>Surfactant</div><div>${requiredSurf.toFixed(2)}L</div>
          <div>$${costSurf.toFixed(2)}</div><div>Scent</div><div>${requiredScent.toFixed(2)}L</div>
          <div>$${costScent.toFixed(2)}</div><div></div><div></div>
        </div>
      `;
    }

    function loadSettings() {
      return {
        shCostPerL: parseFloat(localStorage.getItem("shCostPerL")) || 1.0,
        surfCostPerL: parseFloat(localStorage.getItem("surfCostPerL")) || 1.0,
        scentCostPerL: parseFloat(localStorage.getItem("scentCostPerL")) || 1.0,
      };
    }
  </script>
</body>
</html>
